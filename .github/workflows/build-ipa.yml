name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies and generate iOS project
        working-directory: ./app
        run: |
          flutter pub get
          flutter create --platforms=ios .
          dart run flutter_launcher_icons
          
          # Inject Camera usage description for mobile_scanner into Info.plist
          PLIST_PATH="ios/Runner/Info.plist"
          if grep -q "NSCameraUsageDescription" "$PLIST_PATH"; then
            echo "NSCameraUsageDescription already present."
          else
            sed -i '' '/<dict>/a\
            <key>NSCameraUsageDescription</key>\
            <string>RunMon requires camera access to scan server QR codes for pairing.</string>
            ' "$PLIST_PATH"
          fi

      - name: Build iOS App (.app bundle without code signing)
        working-directory: ./app
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa for SideStore / AltStore sideloading
        working-directory: ./app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r RunMon.ipa Payload/
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunMon-iOS-IPA
          path: app/RunMon.ipa
